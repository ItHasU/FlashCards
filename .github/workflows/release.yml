# Push a tag such as v0.1.0 to publish a release with:
#   - flashcards-web-<tag>.zip : the static web app, ready to upload to any web server
#   - quiz-generator-skill-<tag>.zip : the Claude skill
# then deploy the app to GitHub Pages.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package
        run: |
          mkdir -p release
          (cd dist && zip -r "../release/flashcards-web-${GITHUB_REF_NAME}.zip" .)
          (cd skill && zip -r "../release/quiz-generator-skill-${GITHUB_REF_NAME}.zip" quiz-generator)
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
